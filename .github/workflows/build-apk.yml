name: Build STORM EDEN 4.7.4 Android

on:
  push:
    branches:
      - storm-eden-build-474
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout STORM EDEN 4.7.4
        uses: actions/checkout@v4
        with:
          repository: ReiKatari/STORM_EDEN
          ref: 6da6709e28e240a17df138b3bee57f93aa75526d
          path: storm
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Apply minimal upstream build fixes
        shell: bash
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' storm/src/android/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path('storm/CMakeModules/CPMUtil.cmake')
          s = p.read_text()
          old = '''            ARTIFACT ${ARTIFACT}\n            CUSTOM_KEY "${ARTIFACT_VERSION}-${pkgname}"'''
          new = '''            ARTIFACT ${ARTIFACT}\n            URL "https://${ARTIFACT_GIT_HOST}/${ARTIFACT_REPO}/releases/download/v${ARTIFACT_VERSION}/${ARTIFACT}"\n            CUSTOM_KEY "${ARTIFACT_VERSION}-${pkgname}"'''
          if old not in s:
              raise SystemExit('CPMUtil AddCIPackage target block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build arm64 Nightly Release APK
        id: storm_build
        continue-on-error: true
        working-directory: storm
        shell: bash
        env:
          CCACHE: 'false'
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          set +e
          .ci/android/build.sh -n -t standard -b Release > "$GITHUB_WORKSPACE/storm-build.log" 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print concise build failure
        if: steps.storm_build.outputs.rc != '0'
        shell: bash
        run: |
          echo '===== STORM BUILD ERROR: LAST 180 LINES ====='
          tail -n 180 "$GITHUB_WORKSPACE/storm-build.log"
          echo '===== END STORM BUILD ERROR ====='

      - name: Fail when compiler failed
        if: steps.storm_build.outputs.rc != '0'
        shell: bash
        run: exit 1

      - name: Show artifacts
        if: steps.storm_build.outputs.rc == '0'
        run: find storm/artifacts -maxdepth 2 -type f -printf '%p %k KB\n' || true

      - name: Upload STORM EDEN APK
        if: steps.storm_build.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: STORM-EDEN-4.7.4-Android-arm64-nightly
          path: |
            storm/artifacts/*.apk
            storm/artifacts/*.aab
          if-no-files-found: error
          retention-days: 7

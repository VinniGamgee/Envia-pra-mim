name: Build STORM EDEN 4.7.4 Android

on:
  push:
    branches:
      - storm-eden-build-474
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout STORM EDEN 4.7.4
        uses: actions/checkout@v4
        with:
          repository: ReiKatari/STORM_EDEN
          ref: 6da6709e28e240a17df138b3bee57f93aa75526d
          path: storm
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Fix repository-local Windows Java path
        shell: bash
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' storm/src/android/gradle.properties
          grep -n 'org.gradle.java.home' storm/src/android/gradle.properties || true

      - name: Build arm64 Nightly Release APK
        working-directory: storm
        shell: bash
        env:
          CCACHE: 'false'
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          .ci/android/build.sh -n -t standard -b Release

      - name: Show artifacts
        run: find storm/artifacts -maxdepth 2 -type f -printf '%p %k KB\n' || true

      - name: Upload STORM EDEN APK
        uses: actions/upload-artifact@v4
        with:
          name: STORM-EDEN-4.7.4-Android-arm64-nightly
          path: |
            storm/artifacts/*.apk
            storm/artifacts/*.aab
          if-no-files-found: error
          retention-days: 7
